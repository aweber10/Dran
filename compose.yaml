services:
  dran:
    build:
      context: .
      args:
        PB_VERSION: "0.40.2"
    image: dran:1.0.0
    container_name: dran
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - ${DRAN_DATA_PATH:-./pb_data}:/pb/pb_data
    ports:
      - "${DRAN_BIND_ADDRESS:-127.0.0.1}:${DRAN_PORT:-8090}:8090"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8090/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
